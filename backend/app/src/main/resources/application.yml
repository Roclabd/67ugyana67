server:
  address: ${APP_BIND_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: jdbc:h2:file:./data/workflow
    username: sa
    password:
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  jackson:
    default-property-inclusion: non_null

workflow:
  data-dir: ${APP_DATA_DIR:data}
