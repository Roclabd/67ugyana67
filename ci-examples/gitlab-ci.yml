codeguard-check:
  stage: test
  image: alpine:3.22
  variables:
    WORKFLOW_ID: WORKFLOW_ID_HERE
    CI_RULES_VERSION: codeguard-rules-v2+sast-1
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      set -eu
      body=$(jq -n --arg url "${CI_PROJECT_URL}" --arg sha "$CI_COMMIT_SHA" --arg branch "$CI_COMMIT_REF_NAME" --arg rules "$CI_RULES_VERSION" \
        '{repoUrl:$url,commitSha:$sha,branch:$branch,rulesVersion:$rules}')
      response=$(curl --fail-with-body --silent --show-error --max-time 140 \
        --header "Authorization: Bearer $CI_TOKEN" --header "Content-Type: application/json" \
        --data "$body" "${WORKFLOW_URL%/}/api/ci/workflows/$WORKFLOW_ID/run?wait=true")
      printf '%s' "$response" | jq '{runId,status,coverageStatus,pass,reason,missingAnalyzers}'
      printf '%s' "$response" | jq -e '.pass == true' > /dev/null
